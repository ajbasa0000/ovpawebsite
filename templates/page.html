{% extends 'base.html' %}

{% block title %}{{ page.title }} - OVPA{% endblock %}
{% block meta_description %}{{ page.meta_description|default:page.title }}{% endblock %}

{% block content %}
<section class="section">
    <div class="container">
        <h1>{{ page.title }}</h1>
        <div style="max-width: 800px; margin: 2rem auto;">
            {{ page.content|safe }}
        </div>
    </div>
</section>
{% endblock %}
