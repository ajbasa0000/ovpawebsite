{% extends 'base.html' %}

{% block title %}{{ page.title }} - OVPA{% endblock %}
{% block meta_description %}{{ page.meta_description|default:page.title }}{% endblock %}

{% block content %}
<section class="section" style="background: white;">
    <div class="container">
        <div style="text-align: center; margin-bottom: 5rem;">
            <h1 style="display: inline-block; border-bottom: 5px solid var(--color-maroon-primary); padding-bottom: 1rem;">{{ page.title }}</h1>
        </div>
        
        <div class="content-body" style="max-width: 900px; margin: 0 auto; line-height: 1.8; font-size: 1.1rem; color: var(--color-text-main);">
            {{ page.content|safe }}
        </div>
    </div>
</section>
{% endblock %}
