{% extends 'base.html' %}

{% block title %}{{ article.title }} - OVPA{% endblock %}

{% block content %}
<section class="section">
    <div class="container">
        <article style="max-width: 800px; margin: 0 auto;">
            <p class="card-meta">{{ article.published_date|date:"F d, Y" }}</p>
            <h1>{{ article.title }}</h1>

            {% if article.featured_image %}
            <img src="{{ article.featured_image.url }}" alt="{{ article.title }}"
                style="width: 100%; height: 400px; object-fit: cover; border-radius: var(--border-radius); margin: 2rem 0;">
            {% endif %}

            <div style="line-height: 1.8;">
                {{ article.content|safe }}
            </div>

            <div style="margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--color-slate-200);">
                <a href="{% url 'news_list' %}" class="btn btn-outline">← Back to News</a>
            </div>
        </article>
    </div>
</section>
{% endblock %}
